# Plantilla base: un único servicio "web". Nunca se usa sola a propósito:
#   - "docker compose up" (sin -f) suma automáticamente
#     docker-compose.override.yml (dev, hot-reload de Vite).
#   - Producción encadena este archivo con docker-compose.prod.yml
#     explícitamente (ver Makefile: make docker-up-prod).
# A diferencia de iCode-back, no hay Postgres acá: este proyecto es un SPA
# estático que solo habla con la API por HTTP, nunca directo con una base.
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
