user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # No anunciar la versión de nginx en headers de error/Server.
  server_tokens off;

  log_format main '$remote_addr - [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/javascript application/xml image/svg+xml;

  # Rate limit de borde — defensa en profundidad para un SPA estático
  # (no hay backend propio detrás que proteger, pero evita que un solo
  # cliente sature el proxy). 30 req/s por IP con ráfaga de 60.
  limit_req_zone $binary_remote_addr zone=web_limit:10m rate=30r/s;

  # HTTP -> HTTPS. Nada de lógica acá aparte de la redirección.
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeceras de seguridad a nivel de borde — el bundle de React no las
    # puede setear él mismo, así que nginx es el único lugar donde viven.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;

    root /usr/share/nginx/html;
    index index.html;

    # Sin rate limit propio: para que un healthcheck/monitor frecuente no
    # se autobloquee (mismo criterio que iCode-back).
    location = /health {
      add_header Content-Type text/plain always;
      return 200 "ok\n";
    }

    # Assets con hash en el nombre (build de Vite, ej. index-a1b2c3.js) —
    # cache agresivo porque son inmutables: un cambio de contenido siempre
    # genera un nombre de archivo distinto.
    location /assets/ {
      limit_req zone=web_limit burst=60 nodelay;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta que no matchee un archivo real cae a index.html
    # (deja que React Router resuelva la ruta del lado del cliente).
    # index.html nunca se cachea: es el único archivo sin hash en el nombre.
    location / {
      limit_req zone=web_limit burst=60 nodelay;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
